---
name: Seed Caches

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  # renovate: datasource=github-releases depName=docker/buildx
  BUILDX_VERSION: "v0.37.1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  seed-150:
    name: Seed 15.0 cache from master branch for PR checks.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Configure buildkit image
        run: |
          BUILDKIT_IMAGE="$(awk '/^FROM / {print $2}' buildkit/Dockerfile)"
          printf "BUILDKIT_IMAGE=%s\n" "$BUILDKIT_IMAGE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build 15.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=15.0
          cache-to: type=gha,mode=max,scope=15.0
          context: .
          file: stable/Dockerfile
          provenance: false
          tags: |
            aclemons/slack-lambda:15.0

  seed-current-amd64:
    name: Seed -current amd64 cache from master branch for PR checks.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Configure buildkit image
        run: |
          BUILDKIT_IMAGE="$(awk '/^FROM / {print $2}' buildkit/Dockerfile)"
          printf "BUILDKIT_IMAGE=%s\n" "$BUILDKIT_IMAGE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build current
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=current
          cache-to: type=gha,mode=max,scope=current
          context: .
          file: current/Dockerfile
          provenance: false
          tags: |
            aclemons/slack-lambda:current

  seed-current-arm64:
    name: Seed -current arm64 cache from master branch for PR checks.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Configure buildkit image
        run: |
          BUILDKIT_IMAGE="$(awk '/^FROM / {print $2}' buildkit/Dockerfile)"
          printf "BUILDKIT_IMAGE=%s\n" "$BUILDKIT_IMAGE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build current (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          platforms: linux/arm64/v8
          cache-from: type=gha,scope=current-arm
          cache-to: type=gha,mode=max,scope=current-arm
          context: .
          file: current/Dockerfile
          provenance: false
          tags: |
            aclemons/slack-lambda:current-arm
